name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name VideoToPPT
          --collect-all cv2
          --collect-all PIL
          app.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\VideoToPPT.exe release\VideoToPPT.exe
          Copy-Item README.md release\README.txt
          Compress-Archive -Path release\* -DestinationPath VideoToPPT-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToPPT-Windows
          path: VideoToPPT-Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoToPPT-Windows.zip
          generate_release_notes: true
